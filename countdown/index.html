<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Countdowns</title>
<style>
  :root {
    --bg: #000a02;
    --panel: rgba(0, 10, 3, 0.82);
    --green: #3dff7a;
    --dim: #1f9c4b;
    --faint: #0f4d25;
    --text: #b8f5cb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
  }
  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.55;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46rem;
    padding: 1.75rem clamp(1rem, 4vw, 2.25rem) 2rem;
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(61, 255, 122, 0.08);
  }
  .prompt { color: var(--dim); font-size: 0.9rem; margin: 0; overflow-wrap: anywhere; }
  .prompt b { color: var(--green); font-weight: 400; }
  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.05em;
    background: var(--green);
    vertical-align: text-bottom;
    margin-left: 0.2em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1 {
    margin: 1.25rem 0 0.5rem;
    font-size: clamp(1.1rem, 3.6vw, 1.5rem);
    font-weight: 400;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .days { display: flex; align-items: baseline; gap: 0.9rem; line-height: 0.95; }
  .days output {
    font-size: clamp(5.5rem, 26vw, 13rem);
    font-weight: 700;
    letter-spacing: -0.06em;
    color: var(--green);
    text-shadow: 0 0 18px rgba(61, 255, 122, 0.55), 0 0 2px var(--green);
  }
  .days span { font-size: clamp(1.1rem, 3.5vw, 1.6rem); color: var(--dim); }
  .clock {
    margin-top: 1.25rem;
    font-size: clamp(1.8rem, 7.5vw, 3.2rem);
    color: var(--green);
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(61, 255, 122, 0.4);
  }
  .target { margin-top: 0.9rem; font-size: 0.9rem; color: var(--dim); }
  .list { margin-top: 2rem; }
  ul { list-style: none; margin: 0.75rem 0 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 11ch 1fr;
    gap: 0.25rem 1.25rem;
    padding: 0.7rem 0;
    border-top: 1px solid var(--faint);
  }
  li .left { color: var(--green); white-space: nowrap; }
  li .name { overflow-wrap: anywhere; }
  li .when { display: block; font-size: 0.8rem; color: var(--dim); margin-top: 0.1rem; }
  @media (max-width: 30rem) {
    li { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main id="app">
  <p class="prompt"><b>emil@eekarlss</b>:~$ ./countdown --next<span class="cursor"></span></p>
  <h1 id="label"></h1>
  <div class="days"><output id="d">0</output><span id="dlabel">days</span></div>
  <div class="clock" id="clock" role="timer"></div>
  <div class="target" id="target"></div>
  <div class="list" id="listwrap">
    <p class="prompt"><b>emil@eekarlss</b>:~$ ls upcoming/</p>
    <ul id="list"></ul>
  </div>
</main>

<script>
  // EDIT THIS LIST. Keep the +02:00 (winter) or use +03:00 (summer) so the
  // time is correct for every viewer. Days and months need two digits.
  const EVENTS = [
    { label: "DaTe x Vocalis Halloweensitz",   date: "2026-10-26T18:30:00+02:00" },
    { label: "DaTe x Pulterit Greyscale sitz", date: "2026-11-05T18:30:00+02:00" },
    { label: "DaTe x Kleio Breaking Bad sitz", date: "2026-11-19T18:30:00+02:00" },
  ];
  const DONE_TEXT = "> It’s time.";

  // One-off link: ?date=2026-12-18T09:00:00%2B02:00&label=Exam
  const params = new URLSearchParams(location.search);
  const events = params.get("date")
    ? [{ label: params.get("label") || "Countdown", date: params.get("date") }]
    : EVENTS;

  const items = events
    .map((e) => ({ label: e.label, time: new Date(e.date) }))
    .filter((e) => !isNaN(e.time))
    .sort((a, b) => a.time - b.time);

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (t) => t.toLocaleString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
  const split = (ms) => {
    const s = Math.floor(ms / 1000);
    return {
      days: Math.floor(s / 86400),
      hms: pad(Math.floor((s % 86400) / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60),
    };
  };

  function tick() {
    const now = new Date();
    const upcoming = items.filter((e) => e.time > now);
    if (!upcoming.length) {
      $("label").textContent = items.length ? items[items.length - 1].label : "error: no valid dates";
      $("d").textContent = "0";
      $("dlabel").textContent = "days";
      $("clock").textContent = items.length ? DONE_TEXT : "> use YYYY-MM-DDTHH:MM:SS+02:00";
      $("target").textContent = "";
      $("listwrap").hidden = true;
      return;
    }
    const next = upcoming[0];
    const t = split(next.time - now);
    $("label").textContent = next.label;
    document.title = next.label;
    $("d").textContent = t.days;
    $("dlabel").textContent = t.days === 1 ? "day" : "days";
    $("clock").textContent = t.hms;
    $("target").textContent = fmt(next.time);

    const rest = upcoming.slice(1);
    $("listwrap").hidden = rest.length === 0;
    const list = $("list");
    list.innerHTML = "";
    rest.forEach((e) => {
      const r = split(e.time - now);
      const li = document.createElement("li");
      const left = document.createElement("span");
      left.className = "left";
      left.textContent = r.days + "d " + r.hms;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = e.label;
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = fmt(e.time);
      name.appendChild(when);
      li.append(left, name);
      list.appendChild(li);
    });
  }

  tick();
  setInterval(tick, 1000);

  // Digital rain
  (function () {
    const canvas = $("rain");
    const ctx = canvas.getContext && canvas.getContext("2d");
    if (!ctx) return;
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const glyphs = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789{}[]<>/\\=+*#$";
    const size = 16;
    let cols = 0, drops = [];

    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      cols = Math.ceil(canvas.width / size);
      drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -canvas.height / size));
      ctx.fillStyle = "#000a02";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function step() {
      ctx.fillStyle = "rgba(0, 10, 2, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = size + "px monospace";
      for (let i = 0; i < cols; i++) {
        const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
        const y = drops[i] * size;
        ctx.fillStyle = Math.random() > 0.975 ? "#d4ffe0" : "#2bd160";
        ctx.fillText(ch, i * size, y);
        if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    resize();
    addEventListener("resize", resize);
    if (reduce) {
      for (let i = 0; i < 60; i++) step();
      return;
    }
    let last = 0;
    (function loop(t) {
      if (t - last > 55) { step(); last = t; }
      requestAnimationFrame(loop);
    })(0);
  })();
</script>
</body>
</html>
