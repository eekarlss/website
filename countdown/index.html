<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdowns</title>
<style>
  :root {
    --bg: #dde6e1;
    --ink: #1b2a2f;
    --muted: #55696e;
    --line: #b7c5bf;
    --accent: #2f5dff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201f;
      --ink: #e4eee9;
      --muted: #8fa5a0;
      --line: #2c3d3b;
      --accent: #7d9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
  }
  main { width: 100%; max-width: 44rem; }
  h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    font-weight: 500;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .days { display: flex; align-items: baseline; gap: 1rem; line-height: 0.9; }
  .days output {
    font-size: clamp(6rem, 30vw, 17rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .days span { font-size: clamp(1.25rem, 4vw, 2rem); font-weight: 600; }
  .clock {
    margin-top: 2rem;
    font-size: clamp(1.75rem, 7vw, 3.25rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .target { margin-top: 1.5rem; font-size: 0.95rem; color: var(--muted); }
  ul { list-style: none; margin: 3rem 0 0; padding: 0; border-top: 1px solid var(--line); }
  li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  li .name { font-weight: 600; overflow-wrap: anywhere; }
  li .when { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-top: 0.15rem; }
  li .left {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <h1 id="label"></h1>
  <div class="days"><output id="d">0</output><span id="dlabel">days</span></div>
  <div class="clock" id="clock" role="timer"></div>
  <div class="target" id="target"></div>
  <ul id="list"></ul>
</main>

<script>
  // EDIT THIS LIST. Dates are local time; add +02:00 (winter: +02:00, summer: +03:00)
  // to pin them to Finnish time for every viewer.
  const EVENTS = [
    { label: "DaTe x Vocalis Halloweensitz", date: "2026-10-26T18:30:00+02:00" },
    { label: "DaTe x Pulterit Greyscale sitz", date: "2026-11-05T18:30:00+02:00" },
    { label: "DaTe x Kleio Breaking Bad sitz", date: "2026-11-19T18:30:00+02:00" },
  ];
  const DONE_TEXT = "It's time.";

  // A single custom countdown still works: ?date=2026-12-18T09:00%2B02:00&label=Exam
  const params = new URLSearchParams(location.search);
  const events = params.get("date")
    ? [{ label: params.get("label") || "Countdown", date: params.get("date") }]
    : EVENTS;

  const items = events
    .map((e) => ({ label: e.label, time: new Date(e.date) }))
    .filter((e) => !isNaN(e.time))
    .sort((a, b) => a.time - b.time);

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (t) => t.toLocaleString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
  const split = (ms) => {
    const s = Math.floor(ms / 1000);
    return {
      days: Math.floor(s / 86400),
      hms: pad(Math.floor((s % 86400) / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60),
    };
  };

  function tick() {
    const now = new Date();
    const upcoming = items.filter((e) => e.time > now);
    if (!upcoming.length) {
      $("label").textContent = items.length ? items[items.length - 1].label : "No events set";
      $("d").textContent = "0";
      $("clock").textContent = DONE_TEXT;
      $("target").textContent = "";
      $("list").innerHTML = "";
      return;
    }
    const next = upcoming[0];
    const t = split(next.time - now);
    $("label").textContent = next.label;
    document.title = next.label;
    $("d").textContent = t.days;
    $("dlabel").textContent = t.days === 1 ? "day" : "days";
    $("clock").textContent = t.hms;
    $("target").textContent = fmt(next.time);

    const list = $("list");
    list.innerHTML = "";
    upcoming.slice(1).forEach((e) => {
      const r = split(e.time - now);
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = e.label;
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = fmt(e.time);
      name.appendChild(when);
      const left = document.createElement("span");
      left.className = "left";
      left.textContent = r.days + "d " + r.hms;
      li.append(name, left);
      list.appendChild(li);
    });
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
